[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "moonbite-plugin"
version = "0.1.0a1"
description = "Memory, working state, heartbeat, and bounded autonomy for long-running AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [{name = "Bénie Studio"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "pytest>=8,<9", "pyyaml>=6,<7", "ruff>=0.11,<1"]

[project.entry-points."hermes_agent.plugins"]
moonbite = "moonbite_plugin"

[tool.setuptools.packages.find]
include = ["moonbite_plugin*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
